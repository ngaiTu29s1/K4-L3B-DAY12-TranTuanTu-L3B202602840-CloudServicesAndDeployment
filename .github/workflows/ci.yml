name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: |
          pytest tests/ -v -m "not docker" --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: |
            ngaitu29s1/day12-agent:latest
            ngaitu29s1/day12-agent:${{ github.sha }}

  deploy:
    name: Deploy
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger n8n Deployment Webhook
        env:
          WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          DEPLOY_TOKEN: ${{ secrets.N8N_DEPLOY_TOKEN }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Triggering n8n deployment webhook on server..."
            curl -fsSL -X POST "$WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Deploy-Token: $DEPLOY_TOKEN" \
              -d "{\"event\": \"deploy\", \"repository\": \"${{ github.repository }}\", \"commit\": \"${{ github.sha }}\"}"
            echo "Deployment webhook sent successfully."
          else
            echo "N8N_WEBHOOK_URL secret is not set yet. Skipping live trigger."
          fi
